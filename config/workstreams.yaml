# Workstream routing table for the orchestrator.
#
# Derived from a scan of nadav.delgo@gmail.com (sent mail + inbox, mid-2026).
# This is the single source of truth for "which company does this belong to".
# Edit freely — the skills read this file, they do not hardcode anything.

owner:
  name: Nadav Delgo
  hub_account: nadav.delgo@gmail.com   # everything lands here
  aliases:
    - nadav.d@tinu.ai                  # Tinu identity, forwards into the hub
  languages: [he, en]                  # writes and receives in both

# ---------------------------------------------------------------------------
# GROUPS — Apex and VelocityX are run together and share staff.
# Never treat a sender alone as decisive between them; see disambiguation.
# ---------------------------------------------------------------------------
groups:
  apex_velocityx:
    label: "Apex + VelocityX"
    members: [apex, velocityx]
    shared_people:
      - name: Avishag
        addresses: [avishag@apex.org.il, avishag@velocityx.vc]
        note: >
          Primary counterpart on BOTH sides and by far the highest-volume
          correspondent. The address used is a weak hint, not proof — Avishag
          mails from the apex.org.il address about VelocityX matters and vice
          versa. Route on subject and content, not on the From: domain.

# ---------------------------------------------------------------------------
# WORKSTREAMS
# ---------------------------------------------------------------------------
workstreams:

