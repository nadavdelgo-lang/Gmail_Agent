      - family and friends on consumer mail domains
      - government and administrative paperwork (e.g. mops.gov.il)
      - personal finance, health, travel, logistics
      - "service notifications: github, google accounts, spotify, calendly,
        drive shares, read.ai"
    note: >
      Consumer-domain senders (gmail.com and similar) are NOT automatically
      personal — much of the Apex community corresponds from personal
      addresses. Classify those on content, and only fall back to personal
      when no work signal is present.

# ---------------------------------------------------------------------------
# DISAMBIGUATION — applied in order, first match wins
# ---------------------------------------------------------------------------
disambiguation:
  - rule: tinu_by_hardware_topic
    if: >
      thread is about GPU/DGX hardware, data-centre buildout (racks, PDU,
      cooling, UPS, power, connectivity), Nvidia compliance, cost per kW, or
      quoting compute capacity to a customer
    then: tinu   # true even from a consumer-domain sender such as Amizur

  - rule: tinu_by_address
    if: "thread involves any tinu.ai address, or ken.hu@princeton.edu"
    then: tinu

  - rule: apex_vs_velocityx_by_content
    if: "sender is Avishag on either domain"
    then: >
      Decide from the subject and body, not the domain. Money going OUT to a
      company, DD, deal flow, cap tables and founder intros are VelocityX.
      Community, events, delegations, alumni, staff coordination and money
      coming IN as donations are Apex. If the thread genuinely spans both,
      tag it apex_velocityx and say so in the brief.

  - rule: dealflow_domain
    if: "counterparty domain is listed under velocityx.counterparties"
    then: velocityx

  - rule: apex_partner_domain
    if: "sender is on an Apex partner domain (cjp.org, thecohns.us)"
    then: apex

  - rule: automated_noise
    if: "sender is a no-reply / notification address"
    then: personal   # and almost always FYI priority, not action

  - rule: fallback
    then: personal



# ---------------------------------------------------------------------------
# DEAL TRACKER — the Tinu GPU pipeline sheet
# ---------------------------------------------------------------------------
# Standing instruction: every time the user sends a chat from Ken, or from a
# group Ken is in, update this tracker from it. See
# .claude/skills/deal-tracker/SKILL.md for the procedure.
deal_tracker:
  title: "GPU Compute Deal Tracker"
  file_id: "10_6E3oLHeQ2T8aTeM_aIkQG8-BhQF-XIEkdYRbw-lJA"
  url: "https://docs.google.com/spreadsheets/d/10_6E3oLHeQ2T8aTeM_aIkQG8-BhQF-XIEkdYRbw-lJA/edit"
  format: native_google_sheet     # converted 24/08/2026; writes confirmed working
  writable: true
  superseded_xlsx: "1yI5bB7hoFYWWH8ml4vgsFKeHt0gbtH-P"   # frozen snapshot, do not write
  worksheets:
    "Deal Tracker": 691243873     # gid — Zapier wants the gid, not the name
    "Stage Legend": 1719303824
  header_row: 1                   # data starts at row 2, so ID N sits on row N+1
  columns:
    - Deal Tracker ID             # column A header is literally this, not "ID"
    - Deal / Lead
    - Company / Counterparty
    - Contact(s)
    - Product / Ask
    - Volume / Scope
    - Value / Terms
    - Stage
    - Last Contact
    - Next Step
  stages:               # controlled vocabulary, priority order — never invent one
    - Committed/Closing
    - Quote Sent
    - Negotiating
    - Active - POC Running
    - Meeting Scheduled
    - Discovery
    - Backlog
    - Parked / Not Now
  write_path: >
    Zapier Google Sheets (GoogleSheetsV2CLIAPI) — lookup_row / update_row /
    add_row. The connection for nadav.delgo@gmail.com is already authorised.
    The Google Sheets API cannot address an uploaded .xlsx, so the file has to
    be a native Google Sheet first. Never rebuild the file by re-uploading
    bytes — it breaks the link and risks a live commercial record.


# ---------------------------------------------------------------------------
# CALENDAR SUGGESTIONS — where they actually live
# ---------------------------------------------------------------------------
# Events are suggested, never created (creating one mails invitations — see
# CLAUDE.md). A suggestion mentioned only in a chat reply is invisible the
# moment that session ends, and the runner fires 8x/day as fresh background
# sessions, so a suggestion that lives only in reply text is effectively lost.
#
# Every calendar suggestion therefore ALSO becomes a Google Task, in the
# workstream list it belongs to (see labels.* below for the list names), so
# there is one durable place to check regardless of which session produced it.
calendar_suggestions:
  persist_as: google_task
  title_prefix: "📅 "          # marks it as a suggestion, not an action item
  title_format: "📅 {who}, {when} — add to calendar?"
  due: the suggested event's date
  notes: source thread/message link + one line of context
  dedupe: >
    Before adding, check the target list for an existing task whose title
    contains the same who+when. Skip if found — never stack duplicate
    suggestions for the same event.
  dismissal: >
    The user dismisses a suggestion by deleting the task. Do not recreate a
    task that was deleted for the same who+when in the same source thread.

# ---------------------------------------------------------------------------
# CHAT SOURCES — WhatsApp and anything else that is not email
# ---------------------------------------------------------------------------
# No API reads personal WhatsApp chats. Meta's WhatsApp Business Platform only
# exposes messages sent TO a business number, inside a 24-hour window; it
# cannot see a 1:1 with Avishag or Ken, or an arbitrary group. There is no
# WhatsApp MCP connector either. Anything that claims otherwise is an
# unofficial client that violates WhatsApp's terms and risks the number.
#
# The supported path is WhatsApp's own export:
#   chat -> ⋮ -> More -> Export chat -> Without media -> save to Drive
# Drop the .txt in the Drive folder below and the runner reads it on the next
# pass. It is a snapshot, not a live feed — re-export when you want it fresh.
chat_sources:
  drive_folder: "WhatsApp Exports"
  export_format: "WhatsApp .txt export (without media)"
  watched:
    - name: Avishag Bohbot
      workstream: apex_velocityx
      note: >
        Most of the real Apex/VelocityX traffic happens here rather than in
        mail — decisions land in chat and only the artefacts reach email.
    - name: Ken Hu
      workstream: tinu
      note: >
        GPU procurement and customer quotes, US Pacific hours. Every Ken chat
        — 1:1 or a group he is in — also updates the deal_tracker above. That
        is a standing instruction; the user does not ask each time.
    # Add a line per chat or group as the user names them. A group with no
    # obvious owner takes the workstream of what it actually discusses.
  rules:
    - Treat an export as read-only history. Never reply into WhatsApp.
    - An export is stale the moment it is taken. Trust email over an older
      export when the two conflict, and say which you used.
    - Chat is where commitments get made casually. A date agreed in chat is a
      real date; a date guessed from chat is not.

# ---------------------------------------------------------------------------
# GMAIL LABELS the triage skill applies. Created on first run if missing.
# ---------------------------------------------------------------------------
labels:
  apex_velocityx: "Velocity + Apex"  # one label — the two are run together
  tinu: "Tinu"
  # Personal gets no label of its own: real personal threads are marked
  # IMPORTANT instead. Never mark newsletters or notifications important —
  # `is:important` is the backbone of the triage candidate set, and polluting
  # it breaks every future run.
  personal: IMPORTANT
  # "Apex" (Label_9131845736770565248) predates this setup and is left alone.

# ---------------------------------------------------------------------------
# AUTO-REPLY — correspondents the runner ALWAYS drafts for, unprompted
# ---------------------------------------------------------------------------
# The normal gate is `is:important newer_than:1d`. Avishag is the highest-volume
# correspondent across both companies and her mail is not reliably flagged
# important by Gmail, so she gets her own lane that ignores `is:important` and
# uses a wider window. Without this, her threads sit unanswered between runs —
# which is exactly what happened through August.
auto_reply:
  always_draft:
    - name: Avishag Bohbot
      addresses: [avishag@apex.org.il, avishag@velocityx.vc]
      window: 3d              # wider than the main gate; the label stops repeats
      require_important: false
      note: >
        Every thread where her message is the newest and no draft already sits
        on it gets a draft. Route Apex vs VelocityX on content, never on which
        address she used. She writes Hebrew — reply in Hebrew, sign דלג׳ו.
  # These still apply, without exception:
  #   - never send; drafts only
  #   - never stack a second draft on a thread that already has one
  #   - never invent a date, figure or commitment — use [[NADAV: ...]]
  #   - a thread where SHE is waiting on HIM gets a draft; a thread where HE is
  #     waiting on HER does not (nothing to say yet)

# ---------------------------------------------------------------------------
# LABELLING — every triaged thread gets its workstream tag, no exceptions
# ---------------------------------------------------------------------------
labelling:
  mandatory: true
  rule: >
    Every thread the runner reads gets its workstream label before the run ends
    — not only the ones that produced a draft or a task. A thread classified as
    noise still gets labelled and still gets Runner/Handled, otherwise the next
    run re-reads it forever.
  mapping:
    apex_velocityx: "Velocity + Apex"   # Label_2
    tinu: "Tinu"                        # Label_3
    personal: IMPORTANT                 # no label of its own, by design
    handled: "Runner/Handled"           # Label_5 — the state store
  never:
    - Never mark a newsletter or notification IMPORTANT to "label" it as
      personal. Leave it unlabelled and mark it Runner/Handled only.
    - Never apply both workstream labels to one thread. Pick one; if it is
      genuinely both, it is Velocity + Apex.
